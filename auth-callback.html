<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <title>A confirmar...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script>
const SUPABASE_URL  = "https://rujdnhnqzjblevwomvod.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1amRuaG5xempibGV2d29tdm9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNTk5ODIsImV4cCI6MjA5NjczNTk4Mn0.8QMpBCP1aPR_9q8_yqBwB0J7AnHmnvX0Hrp1CDhni0Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

(async () => {
  // Processa o token do URL (vem no hash ou como query param)
  const { data, error } = await sb.auth.getSession();
  if (data?.session || !error) {
    window.location.href = "/Orcamento/";
  } else {
    // Tenta processar o hash manualmente
    const hash = window.location.hash;
    if (hash.includes("access_token")) {
      await sb.auth.setSession({
        access_token: new URLSearchParams(hash.slice(1)).get("access_token"),
        refresh_token: new URLSearchParams(hash.slice(1)).get("refresh_token"),
      });
    }
    window.location.href = "/Orcamento/";
  }
})();
</script>
<p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#888">A confirmar a tua conta...</p>
</body>
</html>
